<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尚礼 APP 图标预览</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #312E81;
            margin-bottom: 20px;
        }
        .icon-wrapper {
            width: 200px;
            height: 200px;
            margin: 0 auto;
        }
        img {
            width: 100%;
            height: 100%;
        }
        p {
            margin-top: 20px;
            color: #6B7280;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>尚礼 APP 图标预览</h1>
        <div class="icon-wrapper">
            <img src="assets/images/logo.svg" alt="App Logo">
        </div>
        <p>图标文件位置: assets/images/logo.svg</p>
    </div>
</body>
</html>
