<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NewShangli - Reminders</title>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Font Awesome for Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<!-- BEGIN: CustomStyles -->
<style data-purpose="typography">
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
    body {
      font-family: 'Noto Sans SC', sans-serif;
    }
  </style>
<style data-purpose="layout-utilities">
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<!-- END: CustomStyles -->
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
<!-- BEGIN: Header -->
<header class="bg-white px-4 py-3 flex items-center justify-between sticky top-0 z-40 border-b border-gray-100" data-purpose="main-header">
<h1 class="text-xl font-bold text-gray-900">提醒</h1>
<button class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center text-gray-600">
<i class="fas fa-plus"></i>
</button>
</header>
<!-- END: Header -->
<!-- BEGIN: FilterBar -->
<div class="px-4 py-3 bg-white border-b border-gray-50 flex gap-4 overflow-x-auto hide-scrollbar" data-purpose="filters">
<button class="bg-indigo-900 text-white px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap shadow-sm shadow-indigo-200">全部</button>
<button class="bg-gray-100 text-gray-600 px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap">生日</button>
<button class="bg-gray-100 text-gray-600 px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap">回礼</button>
<button class="bg-gray-100 text-gray-600 px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap">纪念日</button>
</div>
<!-- END: FilterBar -->
<!-- BEGIN: MainContent -->
<main class="flex-1 overflow-y-auto hide-scrollbar pb-24 p-4 space-y-6" data-purpose="scrollable-content">
<!-- BEGIN: WeeklySection -->
<section>
<h2 class="text-xs font-bold text-gray-500 mb-3 ml-1 uppercase tracking-wider">本周</h2>
<div class="space-y-3">
<!-- Reminder Card: Tomorrow -->
<div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-red-500 flex items-center" data-purpose="reminder-card">
<div class="flex-1">
<div class="flex items-center gap-2 mb-1">
<span class="bg-red-100 text-red-600 text-[10px] px-1.5 py-0.5 rounded font-bold">明天</span>
<h3 class="font-bold text-gray-900">张伟 生日</h3>
</div>
<p class="text-xs text-gray-500">建议红包 ¥600</p>
</div>
<button class="w-8 h-8 rounded-full bg-green-50 text-green-600 flex items-center justify-center">
<i class="fas fa-check text-xs"></i>
</button>
</div>
<!-- Reminder Card: 3 Days -->
<div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-orange-400 flex items-center" data-purpose="reminder-card">
<div class="flex-1">
<div class="flex items-center gap-2 mb-1">
<span class="bg-orange-100 text-orange-600 text-[10px] px-1.5 py-0.5 rounded font-bold">3天后</span>
<h3 class="font-bold text-gray-900">李娜 孩子百日宴</h3>
</div>
<p class="text-xs text-gray-500">上次她送了 ¥800</p>
</div>
<button class="w-8 h-8 rounded-full bg-green-50 text-green-600 flex items-center justify-center">
<i class="fas fa-check text-xs"></i>
</button>
</div>
</div>
</section>
<!-- END: WeeklySection -->
<!-- BEGIN: FutureSection -->
<section>
<h2 class="text-xs font-bold text-gray-500 mb-3 ml-1 uppercase tracking-wider">未来</h2>
<div class="space-y-3">
<!-- Anniversary Item -->
<div class="bg-white p-4 rounded-2xl shadow-sm flex items-center" data-purpose="reminder-list-item">
<div class="w-10 h-10 rounded-full bg-pink-50 text-pink-500 flex items-center justify-center mr-3">
<i class="fas fa-heart"></i>
</div>
<div class="flex-1">
<h3 class="font-bold text-gray-900 text-sm">结婚纪念日</h3>
<p class="text-xs text-gray-500">2月28日 (16天后)</p>
</div>
</div>
<!-- Housewarming Item -->
<div class="bg-white p-4 rounded-2xl shadow-sm flex items-center" data-purpose="reminder-list-item">
<div class="w-10 h-10 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center mr-3">
<i class="fas fa-gift"></i>
</div>
<div class="flex-1">
<h3 class="font-bold text-gray-900 text-sm">王强 乔迁</h3>
<p class="text-xs text-gray-500">3月15日</p>
</div>
</div>
</div>
</section>
<!-- END: FutureSection -->
</main>
<!-- END: MainContent -->
<!-- BEGIN: BottomNavigation -->
<nav class="h-[83px] bg-white border-t border-gray-200 flex justify-around items-start pt-3 pb-8 fixed bottom-0 w-full z-50" data-purpose="tab-bar">
<div class="flex flex-col items-center text-gray-400 w-16 hover:text-indigo-900 transition-colors cursor-pointer">
<i class="fas fa-book text-xl mb-1"></i>
<span class="text-[10px] font-medium">记录</span>
</div>
<div class="flex flex-col items-center text-gray-400 w-16 hover:text-indigo-900 transition-colors cursor-pointer text-indigo-900">
<i class="fas fa-user-friends text-xl mb-1"></i>
<span class="text-[10px] font-medium">关系</span>
</div>
<div class="flex flex-col items-center text-gray-400 w-16 hover:text-indigo-900 transition-colors cursor-pointer">
<i class="fas fa-chart-pie text-xl mb-1"></i>
<span class="text-[10px] font-medium">统计</span>
</div>
<div class="flex flex-col items-center text-gray-400 w-16 hover:text-indigo-900 transition-colors cursor-pointer">
<i class="fas fa-cog text-xl mb-1"></i>
<span class="text-[10px] font-medium">设置</span>
</div>
</nav>
<!-- END: BottomNavigation -->
</body></html>
