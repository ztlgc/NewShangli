<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<title>账簿数据导入 - 婚礼记账</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
<header class="sticky top-0 z-50 flex items-center bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md p-4 justify-between border-b border-primary/10">
<div class="flex items-center gap-3">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full bg-primary/10 text-primary hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-lg font-bold leading-tight tracking-tight">账簿数据导入</h2>
</div>
<div class="size-10"></div>
</header>
<main class="flex-1 flex flex-col p-6 max-w-2xl mx-auto w-full">
<section class="mb-8">
<div class="inline-flex items-center justify-center p-3 mb-4 rounded-2xl bg-primary/10 text-primary">
<span class="material-symbols-outlined text-4xl">content_paste_go</span>
</div>
<h3 class="tracking-tight text-3xl font-bold leading-tight mb-3">粘贴您的账簿数据</h3>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-relaxed">
                    请将其他平台的备份数据、礼金清单或文本账目粘贴在下方。我们将通过智能解析引擎，自动为您提取宾客名称、金额及备注。
                </p>
</section>
<section class="flex flex-col gap-6 flex-1">
<div class="flex flex-col flex-1 group">
<label class="flex flex-col h-full">
<span class="text-slate-700 dark:text-slate-300 text-sm font-semibold mb-2 ml-1">账簿文本数据</span>
<div class="relative flex-1 flex flex-col">
<textarea class="form-input flex-1 w-full min-h-[320px] resize-none rounded-2xl text-slate-900 dark:text-slate-100 border-2 border-primary/20 bg-white dark:bg-slate-900/50 focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all placeholder:text-slate-400 dark:placeholder:text-slate-600 p-5 text-base font-normal leading-relaxed" placeholder="例如：
王小明 500元
李华 800 (同事)
赵大宝 1000..."></textarea>
<div class="absolute bottom-4 right-4 text-xs text-slate-400 pointer-events-none">
                                支持多种格式智能识别
                            </div>
</div>
</label>
</div>
<div class="bg-primary/5 rounded-xl p-4 flex gap-3 border border-primary/10">
<span class="material-symbols-outlined text-primary">info</span>
<p class="text-sm text-slate-600 dark:text-slate-400">
                        提示：导入前请检查姓名与金额是否清晰，解析完成后您仍可以进行二次校验。
                    </p>
</div>
<div class="flex flex-col gap-3 pt-4 mb-8">
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-6 bg-primary text-white text-lg font-bold shadow-lg shadow-primary/25 hover:shadow-primary/40 active:scale-[0.98] transition-all">
<span class="truncate">立即解析并导入</span>
<span class="material-symbols-outlined ml-2">cloud_upload</span>
</button>
<button class="flex w-full cursor-pointer items-center justify-center rounded-xl h-12 px-6 bg-transparent text-slate-500 text-sm font-medium hover:text-primary transition-colors">
                        查看支持的格式范例
                    </button>
</div>
</section>
</main>
<div class="h-8"></div>
</div>
</body></html>
