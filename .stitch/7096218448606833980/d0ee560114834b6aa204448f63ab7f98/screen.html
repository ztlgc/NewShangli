<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                        "custom-blue": "#1a2a4e", // Matching the "dark blue" requested for NewShangli style
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<title>选择事由 - NewShangli</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-screen w-full flex-col overflow-hidden">
<!-- Main Content Placeholder (Background) -->
<div class="flex-1 p-4 opacity-40">
<div class="flex items-center justify-between mb-6">
<div class="h-8 w-8 rounded-full bg-slate-200"></div>
<div class="h-6 w-32 bg-slate-200 rounded"></div>
<div class="h-8 w-8 rounded-full bg-slate-200"></div>
</div>
<div class="space-y-4">
<div class="h-32 w-full bg-slate-200 rounded-xl"></div>
<div class="h-20 w-full bg-slate-200 rounded-xl"></div>
<div class="h-20 w-full bg-slate-200 rounded-xl"></div>
</div>
</div>
<!-- Overlay / Backdrop -->
<div class="absolute inset-0 z-10 bg-black/60 flex flex-col justify-end">
<!-- Bottom Sheet Modal -->
<div class="bg-white dark:bg-slate-900 rounded-t-[32px] w-full flex flex-col max-h-[795px]">
<!-- BottomSheetHandle -->
<div class="flex h-6 w-full items-center justify-center pt-2">
<div class="h-1.5 w-12 rounded-full bg-slate-300 dark:bg-slate-700"></div>
</div>
<!-- Header -->
<div class="px-6 pt-4 pb-2">
<h1 class="text-custom-blue dark:text-slate-100 text-xl font-bold text-center">选择事由</h1>
</div>
<!-- Search Bar -->
<div class="px-6 py-4">
<div class="flex items-center bg-slate-100 dark:bg-slate-800 rounded-xl px-4 py-3 gap-3">
<span class="material-symbols-outlined text-slate-400">search</span>
<input class="bg-transparent border-none focus:ring-0 p-0 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 flex-1 text-base" placeholder="搜索事由..." type="text"/>
</div>
</div>
<!-- Reasons Grid -->
<div class="flex-1 overflow-y-auto px-6 pb-6">
<div class="grid grid-cols-2 gap-4">
<!-- Wedding -->
<div class="flex items-center gap-3 p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800">
<div class="flex h-10 w-10 items-center justify-center rounded-full bg-rose-100 text-rose-500">
<span class="material-symbols-outlined">favorite</span>
</div>
<span class="text-slate-800 dark:text-slate-200 font-semibold">结婚</span>
</div>
<!-- Full Moon -->
<div class="flex items-center gap-3 p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800">
<div class="flex h-10 w-10 items-center justify-center rounded-full bg-blue-100 text-blue-500">
<span class="material-symbols-outlined">child_care</span>
</div>
<span class="text-slate-800 dark:text-slate-200 font-semibold">满月</span>
</div>
<!-- Birthday -->
<div class="flex items-center gap-3 p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800">
<div class="flex h-10 w-10 items-center justify-center rounded-full bg-amber-100 text-amber-500">
<span class="material-symbols-outlined">cake</span>
</div>
<span class="text-slate-800 dark:text-slate-200 font-semibold">生日</span>
</div>
<!-- Housewarming -->
<div class="flex items-center gap-3 p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800">
<div class="flex h-10 w-10 items-center justify-center rounded-full bg-emerald-100 text-emerald-500">
<span class="material-symbols-outlined">home</span>
</div>
<span class="text-slate-800 dark:text-slate-200 font-semibold">乔迁</span>
</div>
<!-- New Year -->
<div class="flex items-center gap-3 p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800">
<div class="flex h-10 w-10 items-center justify-center rounded-full bg-red-100 text-red-600">
<span class="material-symbols-outlined">celebration</span>
</div>
<span class="text-slate-800 dark:text-slate-200 font-semibold">过年</span>
</div>
<!-- Funeral -->
<div class="flex items-center gap-3 p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800">
<div class="flex h-10 w-10 items-center justify-center rounded-full bg-slate-200 text-slate-600">
<span class="material-symbols-outlined">cloud</span>
</div>
<span class="text-slate-800 dark:text-slate-200 font-semibold">白事</span>
</div>
<!-- Other -->
<div class="flex items-center gap-3 p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800">
<div class="flex h-10 w-10 items-center justify-center rounded-full bg-purple-100 text-purple-500">
<span class="material-symbols-outlined">more_horiz</span>
</div>
<span class="text-slate-800 dark:text-slate-200 font-semibold">其他</span>
</div>
</div>
</div>
<!-- Primary Action Button -->
<div class="px-6 pt-4 pb-10 border-t border-slate-100 dark:border-slate-800">
<button class="w-full bg-custom-blue hover:bg-opacity-90 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-2 transition-colors">
<span class="material-symbols-outlined text-lg">add</span>
<span>自定义事由</span>
</button>
</div>
</div>
</div>
</div>
</body></html>
